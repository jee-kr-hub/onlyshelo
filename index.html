<!DOCTYPE html>
<html>
<head>
  <title>Only Shelo ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    }

    /* ❤️ Floating hearts */
    .heart{
      position:absolute;
      bottom:-20px;
      animation:floatUp 8s linear infinite;
      opacity:.7;
      pointer-events:none;
    }

    @keyframes floatUp{
      from{transform:translateY(0);}
      to{transform:translateY(-110vh);}
    }

    /* Card */
    .card{
      width:92vw;
      max-width:420px;
      padding:50px 25px;
      background:rgba(255,255,255,.25);
      backdrop-filter:blur(14px);
      border-radius:25px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.2);
      position:relative;
    }

    h1{
      color:white;
      font-size:28px;
      margin-bottom:40px;
    }

    /* Button row */
    .btnRow{
      display:flex;
      justify-content:center;
      gap:15px;
      position:relative;
      height:140px;
    }

    .btn{
      padding:15px 34px;
      font-size:18px;
      border-radius:30px;
      border:none;
      cursor:pointer;
      transition:.5s;
    }

    #yes{
      background:#ff4d6d;
      color:white;
      box-shadow:0 0 18px #ff4d6d;
    }

    #yes:hover{
      transform:scale(1.1);
    }

    #no{
      background:#eee;
    }

    /* when moving */
    .absolute{
      position:absolute;
    }

    /* extra mobile boost */
    @media(max-width:480px){
      h1{font-size:30px;}
      .btn{font-size:20px;}
    }
  </style>
</head>

<body>

<div id="hearts"></div>

<div class="card">
  <h1 id="question">Will you forgive me? 🥺</h1>

  <div class="btnRow">
    <button id="yes" class="btn">Yes ❤️</button>
    <button id="no" class="btn">No 😒</button>
  </div>
</div>

<script>
const question = document.getElementById("question");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const btnRow = document.querySelector(".btnRow");
const hearts = document.getElementById("hearts");

let firstMove = false;
let noCount = 0;

/* floating hearts */
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerText="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(16+Math.random()*20)+"px";
  hearts.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
},300);

/* change messages */
const messages=[
  "Think once please 😔",
  "Twin please 🥺",
  "Baby man jao na ❤️",
  "I'm really sorry 😭",
  "Only Yes allowed now 😌"
];

yesBtn.onclick=()=>{
  document.body.innerHTML="<h1 style='color:white;text-align:center'>Thank you for forgiving me ❤️<br>I love you 🫶</h1>";
};

noBtn.onclick=()=>handleNo();

function handleNo(){
  noCount++;

  if(!firstMove){
    noBtn.classList.add("absolute"); // becomes movable only after first click
    firstMove=true;
  }

  if(noCount<=messages.length){
    question.innerText=messages[noCount-1];
    moveButton();
  }else{
    noBtn.style.display="none";
  }
}

function moveButton(){
  const w=btnRow.clientWidth-noBtn.offsetWidth;
  const h=btnRow.clientHeight-noBtn.offsetHeight;

  noBtn.style.left=Math.random()*w+"px";
  noBtn.style.top=Math.random()*h+"px";
}
</script>

</body>
</html>
