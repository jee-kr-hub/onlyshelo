<!DOCTYPE html>
<html>
<head>
  <title>Only Shelo ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#ffdde1,#ee9ca7);
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      color: rgba(255,255,255,0.7);
      animation: floatUp 8s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity:1; }
      to { transform: translateY(-110vh); opacity:0; }
    }

    /* Card */
    .card {
      position: relative;
      width: 360px;
      height: 320px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(14px);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      text-align: center;
      overflow: hidden;
    }

    h1 {
      color: white;
      font-size: 24px;
      margin-bottom: 50px;
    }

    .btn {
      padding: 12px 26px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: 0.6s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eee;
      position: absolute;
    }

    .btnRow {
      position: relative;
      height: 120px;
    }

  </style>
</head>

<body>

<div id="hearts"></div>

<div class="card">

  <h1 id="question">Will you forgive me? 🥺</h1>

  <div class="btnRow">
    <button class="btn" id="yes">Yes ❤️</button>
    <button class="btn" id="no">No 😒</button>
  </div>

</div>

<script>
  const question = document.getElementById("question");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const hearts = document.getElementById("hearts");
  const btnRow = document.querySelector(".btnRow");

  /* Floating hearts */
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*20) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";
    hearts.appendChild(heart);
    setTimeout(()=>heart.remove(),8000);
  }, 300);


  const messages = [
    "Think once please 😔",
    "Twin please 🥺",
    "Baby man jao na ❤️",
    "I'm really sorry 😭",
    "Only Yes allowed now 😌"
  ];

  let noCount = 0;

  yesBtn.onclick = () => {
    document.body.innerHTML =
      "<h1 style='color:white;text-align:center'>Thank you for forgiving me ❤️<br>I love you 🫶</h1>";
  };

  noBtn.onclick = () => handleNo();

  noBtn.addEventListener("mouseover", () => {
    if (window.innerWidth > 768) handleNo();
  });

  function handleNo() {
    noCount++;

    if (noCount <= messages.length) {
      question.innerText = messages[noCount - 1];
      moveButton();
    } else {
      noBtn.style.display = "none";
    }
  }

  /* FIXED movement (inside card only) */
  function moveButton() {
    const areaWidth = btnRow.clientWidth - noBtn.offsetWidth - 10;
    const areaHeight = btnRow.clientHeight - noBtn.offsetHeight - 10;

    const x = Math.random() * areaWidth;
    const y = Math.random() * areaHeight;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  moveButton();
</script>

</body>
</html>
