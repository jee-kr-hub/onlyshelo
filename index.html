<!DOCTYPE html>
<html>
<head>
  <title>Only Shelo ❤️</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    }

    /* floating hearts background */
    .heart{
      position:absolute;
      bottom:-20px;
      animation:floatUp 8s linear infinite;
      pointer-events:none;
      opacity:.7;
    }

    @keyframes floatUp{
      from{transform:translateY(0);}
      to{transform:translateY(-110vh);}
    }

    /* card */
    .card{
      width:92vw;
      max-width:420px;
      padding:50px 25px;
      background:rgba(255,255,255,.25);
      backdrop-filter:blur(14px);
      border-radius:25px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.2);
      position:relative;
    }

    h1{
      color:white;
      font-size:28px;
      margin-bottom:40px;
    }

    .btnRow{
      display:flex;
      justify-content:center;
      gap:15px;
      position:relative;
      height:150px;
    }

    .btn{
      padding:15px 34px;
      font-size:18px;
      border-radius:30px;
      border:none;
      cursor:pointer;
      transition:.5s;
    }

    #yes{
      background:#ff4d6d;
      color:white;
      box-shadow:0 0 15px #ff4d6d;
    }

    #yes:hover{
      transform:scale(1.1);
    }

    #no{
      background:#eee;
      position:absolute;
    }

    /* final screen */
    .finalScreen{
      height:100vh;
      width:100vw;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      overflow:hidden;
      position:relative;
      text-align:center;
    }

    .lovePhoto{
      width:80%;
      max-width:320px;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.3);
      margin-bottom:25px;
    }

    .loveText{
      color:white;
      font-size:26px;
    }

    .kiss{
      position:absolute;
      top:-20px;
      font-size:24px;
      animation:kissFall 6s linear forwards;
      pointer-events:none;
    }

    @keyframes kissFall{
      to{transform:translateY(110vh);opacity:0;}
    }

    @media(max-width:480px){
      h1{font-size:30px;}
      .btn{font-size:20px;}
    }

  </style>
</head>

<body>

<div id="hearts"></div>

<div class="card">
  <h1 id="question">Will you forgive me? 🥺</h1>

  <div class="btnRow">
    <button id="yes" class="btn">Yes ❤️</button>
    <button id="no" class="btn">No 😒</button>
  </div>
</div>

<script>
const question=document.getElementById("question");
const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");
const hearts=document.getElementById("hearts");
const btnRow=document.querySelector(".btnRow");

let firstMove=false;
let noCount=0;

/* floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*20)+"px";
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),8000);
},300);

/* messages */
const messages=[
  "Think once please 😔",
  "Twin please 🥺",
  "Baby man jao na ❤️",
  "I'm really sorry 😭",
  "Only Yes allowed now 😌"
];

/* YES CLICK → photo + kisses */
yesBtn.onclick=()=>{
  document.body.innerHTML=`
    <div class="finalScreen">
      <img src="photo.jpg" class="lovePhoto">
      <h1 class="loveText">Thank you for forgiving me ❤️<br>I love you so much 🫶</h1>
      <div id="kisses"></div>
    </div>
  `;
  startKisses();
};

/* NO click */
noBtn.onclick=()=>handleNo();

function handleNo(){
  noCount++;

  if(!firstMove){
    firstMove=true;
  }

  if(noCount<=messages.length){
    question.innerText=messages[noCount-1];
    moveButton();
  }else{
    noBtn.style.display="none";
  }
}

/* movement inside card only */
function moveButton(){
  const card=document.querySelector(".card");
  const w=card.clientWidth-noBtn.offsetWidth;
  const h=card.clientHeight-noBtn.offsetHeight-80;

  noBtn.style.left=Math.random()*w+"px";
  noBtn.style.top=Math.random()*h+80+"px";
}

/* falling kisses */
function startKisses(){
  const container=document.getElementById("kisses");

  setInterval(()=>{
    const k=document.createElement("div");
    k.className="kiss";
    k.innerText="💋";
    k.style.left=Math.random()*100+"vw";
    k.style.fontSize=(20+Math.random()*20)+"px";
    container.appendChild(k);
    setTimeout(()=>k.remove(),6000);
  },200);
}
</script>

</body>
</html>
