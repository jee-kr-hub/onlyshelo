<!DOCTYPE html>
<html>
<head>
  <title>Only Shelo ❤️</title>

  <!-- Cute font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      color: rgba(255,255,255,0.7);
      font-size: 20px;
      animation: floatUp 8s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* Glass card */
    .card {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(14px);
      padding: 55px 40px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      animation: fadeIn 1.2s ease;
      min-width: 320px;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: scale(0.9);}
      to {opacity:1; transform: scale(1);}
    }

    h1 {
      font-size: 30px;
      margin-bottom: 30px;
      color: white;
      text-shadow: 0 0 12px rgba(255,255,255,0.8);
    }

    .btn {
      padding: 14px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: 0.8s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 0 20px #ff4d6d;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eee;
      position: absolute;
    }

  </style>
</head>

<body>

<div id="hearts"></div>

<div class="card">
  <h1 id="question">Will you forgive me? 🥺</h1>

  <button class="btn" id="yes">Yes ❤️</button>
  <button class="btn" id="no">No 😒</button>
</div>

<script>
  const question = document.getElementById("question");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const heartsContainer = document.getElementById("hearts");

  /* Floating hearts generator */
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*20) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";
    heartsContainer.appendChild(heart);
    setTimeout(()=>heart.remove(),8000);
  }, 300);


  let noCount = 0;

  /* ✨ CHANGE YOUR MESSAGES HERE ✨ */
  const messages = [
    "Think about it once 😔",
    "Twin please 🥺",
    "Baby man jao na ❤️",
    "I'm really really sorry 😭",
    "Only Yes allowed now 😌"
  ];

  yesBtn.onclick = () => {
    document.body.innerHTML =
      "<h1 style='color:white;font-size:36px;text-align:center'>Thank you for forgiving me ❤️<br>I love you so much 🫶</h1>";
  };

  noBtn.onclick = () => handleNo();

  noBtn.addEventListener("mouseover", () => {
    if (window.innerWidth > 768) handleNo();
  });

  function handleNo() {
    noCount++;

    if (noCount <= messages.length) {
      question.innerText = messages[noCount - 1];
      moveButton();
    } else {
      noBtn.style.display = "none";
    }
  }

  function moveButton() {
    setTimeout(() => {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }, 400);
  }

  moveButton();
</script>

</body>
</html>
