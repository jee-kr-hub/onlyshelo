<!DOCTYPE html>
<html>
<head>
  <title>Only Shelo ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#ffdde1,#ee9ca7);
    }

    /* ❤️ Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      color: rgba(255,255,255,0.7);
      animation: floatUp 8s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity:1; }
      to { transform: translateY(-110vh); opacity:0; }
    }

    /* 🌸 Card */
    .card {
      position: relative;
      width: 90vw;          /* responsive width */
      max-width: 420px;    /* desktop limit */
      min-height: 300px;

      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(14px);
      border-radius: 25px;

      padding: 40px 25px;
      text-align: center;
      overflow: hidden;

      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    /* Bigger text */
    h1 {
      color: white;
      font-size: 26px;
      margin-bottom: 45px;
      line-height: 1.4;
    }

    /* Buttons */
    .btn {
      padding: 14px 32px;
      border-radius: 30px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin: 10px;
      transition: 0.6s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      box-shadow: 0 0 15px #ff4d6d;
    }

    #yes:hover {
      transform: scale(1.1);
    }

    #no {
      background: #eee;
      position: absolute;
    }

    .btnRow {
      position: relative;
      height: 150px;
    }

    /* 📱 Extra mobile boost */
    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .btn { font-size: 20px; padding: 16px 36px; }
      .card { padding: 50px 25px; }
    }

  </style>
</head>

<body>

<div id="hearts"></div>

<div class="card">
  <h1 id="question">Will you forgive me? 🥺</h1>

  <div class="btnRow">
    <button class="btn" id="yes">Yes ❤️</button>
    <button class="btn" id="no">No 😒</button>
  </div>
</div>

<script>
  const question = document.getElementById("question");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const hearts = document.getElementById("hearts");
  const btnRow = document.querySelector(".btnRow");

  /* floating hearts */
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (16 + Math.random()*20) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";
    hearts.appendChild(heart);
    setTimeout(()=>heart.remove(),8000);
  }, 300);

  const messages = [
    "Think once please 😔",
    "Twin please 🥺",
    "Baby man jao na ❤️",
    "I'm really sorry 😭",
    "Only Yes allowed now 😌"
  ];

  let noCount = 0;

  yesBtn.onclick = () => {
    document.body.innerHTML =
      "<h1 style='color:white;text-align:center;font-size:32px'>Thank you for forgiving me ❤️<br>I love you 🫶</h1>";
  };

  noBtn.onclick = () => handleNo();

  function handleNo() {
    noCount++;

    if (noCount <= messages.length) {
      question.innerText = messages[noCount - 1];
      moveButton();
    } else {
      noBtn.style.display = "none";
    }
  }

  /* stays inside card */
  function moveButton() {
    const w = btnRow.clientWidth - noBtn.offsetWidth - 10;
    const h = btnRow.clientHeight - noBtn.offsetHeight - 10;

    const x = Math.random()*w;
    const y = Math.random()*h;

    noBtn.style.left = x+"px";
    noBtn.style.top = y+"px";
  }

  moveButton();
</script>

</body>
</html>
