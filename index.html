<!DOCTYPE html>
<html>
<head>
  <title>Only Shelo ❤️</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    }

    /* floating hearts */
    .heart{
      position:absolute;
      bottom:-20px;
      animation:floatUp 8s linear infinite;
      opacity:.7;
      pointer-events:none;
    }

    @keyframes floatUp{
      from{transform:translateY(0);}
      to{transform:translateY(-110vh);}
    }

    /* card */
    .card{
      width:92vw;
      max-width:420px;
      padding:50px 25px;
      background:rgba(255,255,255,.25);
      backdrop-filter:blur(14px);
      border-radius:25px;
      text-align:center;
      position:relative;
    }

    h1{
      color:white;
      font-size:28px;
      margin-bottom:35px;
    }

    /* BUTTON ROW */
    .btnRow{
      position:relative;
      height:160px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:20px;
    }

    .btn{
      padding:14px 26px; /* smaller + equal */
      font-size:16px;
      border-radius:25px;
      border:none;
      cursor:pointer;
      width:110px; /* same width */
      transition:.4s;
    }

    #yes{
      background:#ff4d6d;
      color:white;
    }

    #yes:hover{
      transform:scale(1.08);
    }

    #no{
      background:#eee;
      position:absolute;
      top:70px; /* starts below YES */
    }

    /* FULL SCREEN PHOTO */
    .finalScreen{
      height:100vh;
      width:100vw;
      position:relative;
      overflow:hidden;
    }

    .lovePhoto{
      position:absolute;
      width:100%;
      height:100%;
      object-fit:cover; /* full screen image */
      top:0;
      left:0;
    }

    .loveText{
      position:absolute;
      bottom:40px;
      width:100%;
      text-align:center;
      font-size:26px;
      color:white;
      text-shadow:0 0 10px black;
      z-index:2;
    }

    /* kisses */
    .kiss{
      position:absolute;
      top:-20px;
      animation:kissFall 4s linear forwards;
      pointer-events:none;
      z-index:3;
    }

    @keyframes kissFall{
      to{transform:translateY(110vh);opacity:0;}
    }

  </style>
</head>

<body>

<div id="hearts"></div>

<div class="card">
  <h1 id="question">Will you forgive me? 🥹</h1>

  <div class="btnRow">
    <button id="yes" class="btn">Yes 🎀</button>
    <button id="no" class="btn">No 😒</button>
  </div>
</div>

<script>
const question=document.getElementById("question");
const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");
const btnRow=document.querySelector(".btnRow");
const hearts=document.getElementById("hearts");

let noCount=0;

/* floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(15+Math.random()*18)+"px";
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),8000);
},350);

/* messages */
const messages=[
  "Think about it  once 😒",
  "TWIN TWIN TWINNNNNNNNNNNNNNNN ",
  "Baby man jao na😑 ",
  "IM SORRY SORRYYY SORYYYYYYYYYYYYYYYYYYYYYYYYYYY😭",
  "BSDK maan ja suule😭💔"
];

/* YES → full screen photo + MANY kisses */
yesBtn.onclick=()=>{
  document.body.innerHTML=`
    <div class="finalScreen">
      <img src="photo.jpg" class="lovePhoto">
      <h1 class="loveText">I LOVE YOU I LOVE YOU I LOVEEBBBEEEE YOUUUUUUUUUUUUUUUU MWAHHHHH MWAH<br>phrise esa randi rona karu tho block kardiyo bhai😭</h1>
      <div id="kisses"></div>
    </div>
  `;
  startKisses();
};

/* NO click */
noBtn.onclick=()=>handleNo();

function handleNo(){
  noCount++;

  if(noCount<=messages.length){
    question.innerText=messages[noCount-1];
    moveButton();
  }else{
    noBtn.style.display="none";
  }
}

/* movement only lower half (never overlaps YES) */
let lastX = 0;
let lastY = 0;

function moveButton() {
  const yesRect = yesBtn.getBoundingClientRect();
  const cardRect = btnRow.getBoundingClientRect();

  const safeGap = 25; // space around YES
  const minJump = 110; // minimum distance jump (makes it far)

  let x, y, tries = 0;

  do {
    x = Math.random() * (btnRow.clientWidth - noBtn.offsetWidth);
    y = Math.random() * (btnRow.clientHeight - noBtn.offsetHeight) + 70;

    const dx = Math.abs(x - lastX);
    const dy = Math.abs(y - lastY);

    const noLeft = x + cardRect.left;
    const noRight = noLeft + noBtn.offsetWidth;
    const noTop = y + cardRect.top;
    const noBottom = noTop + noBtn.offsetHeight;

    const overlapYes =
      !(noRight < yesRect.left - safeGap ||
        noLeft > yesRect.right + safeGap ||
        noBottom < yesRect.top - safeGap ||
        noTop > yesRect.bottom + safeGap);

    const farEnough = (dx + dy) > minJump;

    tries++;

    if (!overlapYes && farEnough) break;

  } while (tries < 50);

  lastX = x;
  lastY = y;

  noBtn.style.transition = "none"; // instant jump (faster)
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}
/* MANY kisses */
function startKisses(){
  const container=document.getElementById("kisses");

  setInterval(()=>{
    for(let i=0;i<5;i++){  // more per burst
      const k=document.createElement("div");
      k.className="kiss";
      k.innerText="💋";
      k.style.left=Math.random()*100+"vw";
      k.style.fontSize=(20+Math.random()*25)+"px";
      container.appendChild(k);
      setTimeout(()=>k.remove(),4000);
    }
  },120); // faster spawn
}
</script>

</body>
</html>
